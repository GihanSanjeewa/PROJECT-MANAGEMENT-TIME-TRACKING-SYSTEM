version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: pulseflow_pm
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulseflow_pm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseflow-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      ENV: "development"
      DB_DSN: "postgres://postgres:password123@postgres:5432/pulseflow_pm?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "super-secret-pulseflow-jwt-key-minimum-32-chars!"
      WORK_HOURS_PER_DAY: "8.0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
